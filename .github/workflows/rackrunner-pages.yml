name: Deploy RackRunner Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/rackrunner/**'
      - '.github/workflows/rackrunner-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rackrunner-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/rackrunner
      - id: deployment
        uses: actions/deploy-pages@v4
