<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RackRunner — Double Elimination</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #040906; color: #f4faf6; padding: 8px; padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); -webkit-text-size-adjust: 100%; }
    button, input, select { font: inherit; outline: none; }
    button { min-height: 44px; border-radius: 10px; padding: 8px 12px; background: #fff; color: #050706; font-weight: 800; border: 2px solid #050706; cursor: pointer; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: #2bc861 !important; color: #fff !important; }
    button.danger { background: #ff405d !important; color: #fff !important; }
    button.ghost { background: rgba(255,255,255,.08) !important; color: #fff !important; border: 1px solid rgba(255,255,255,.15) !important; }
    button.small { min-height: 34px; padding: 4px 8px; font-size: 12px; }
    input, select { width: 100%; min-height: 44px; background: #020704; color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 8px 10px; }
    .app { max-width: 800px; margin: 0 auto; }
    .card { background: #0d2315; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sub { color: #a9b9af; font-size: 12px; }
    .badge { display: inline-block; padding: 3px 6px; border-radius: 6px; font-size: 11px; font-weight: 800; background: rgba(255,255,255,.1); color: #a9b9af; }
    .badge.green { background: #2bc861; color: #050706; }
    .badge.warn { background: #ffd166; color: #050706; }
    .tableCard { background: #08130c; border: 1px solid rgba(22,184,78,.4); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .fighter { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 8px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .scoreBox { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .score { font-size: 18px; font-weight: 900; min-width: 24px; text-align: center; }
    .itemRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: rgba(255,255,255,.03); margin-bottom: 6px; }
    .itemRow input { min-height: 36px; }
    .dock { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); background: #040906; border-top: 1px solid rgba(255,255,255,.15); z-index: 1000; }
    .dock button { min-height: 44px; font-size: 12px; padding: 2px; background: rgba(255,255,255,.06); color: #fff; border: 1px solid rgba(255,255,255,.15); }
    .dock button.active { background: #2bc861; color: #050706; border-color: #2bc861; }
    .raceHit { color: #2bc861; font-weight: 800; }
    .settingBlock { margin: 12px 0; }
    .settingBlock label { display: block; margin-bottom: 6px; }
    .stepper { display: flex; gap: 6px; align-items: center; }
    .stepper input { flex: 1; text-align: center; min-width: 0; }
    .stepper button { min-width: 52px; min-height: 52px; font-size: 22px; line-height: 1; padding: 0; }
    .cta { width: 100%; margin-top: 12px; font-size: 16px; }
    .stepCard { border: 1px solid rgba(44,184,78,.35); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    .stepCard.done { border-color: rgba(44,184,78,.6); background: rgba(44,184,78,.08); }
    .stepNum { font-size: 11px; font-weight: 800; color: #2bc861; margin-bottom: 4px; }
    .moneyCard { border-color: rgba(255,209,102,.45); background: rgba(255,209,102,.06); }
    .moneyCard h3 { font-size: 22px; }
    .paidBtn { min-width: 88px; }
  </style>
</head>
<body>
  <div class="app">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 id="tTitle">RackRunner</h2>
      <span class="badge green" id="tPhase">Setup</span>
    </div>
    <main id="view"></main>
  </div>

  <div class="dock">
    <button id="b-home" onclick="window.setTab('home')">Start</button>
    <button id="b-players" onclick="window.setTab('players')">Roster</button>
    <button id="b-bracket" onclick="window.setTab('bracket')">Bracket</button>
    <button id="b-setup" onclick="window.setTab('setup')">Setup</button>
  </div>

  <script>
(function () {
  "use strict";

  const STORAGE_KEY = "rr_strict_dbe";
  const MAX_PLAYERS = 20;

  const BLANK = {
    tab: "setup",
    phase: "setup",
    tables: 0,
    raceTo: 0,
    buyIn: 0,
    barAdded: 0,
    payout1: 0,
    payout2: 0,
    payout3: 0,
    players: [],
    bracket: { W: {}, L: {}, F: {}, R: {} },
    feeders: {}
  };

  let S = loadState();
  normalizeState();

  function normalizeState() {
    S.buyIn = S.buyIn || 0;
    S.barAdded = S.barAdded || 0;
    S.payout1 = S.payout1 || 0;
    S.payout2 = S.payout2 || 0;
    S.payout3 = S.payout3 || 0;
    for (let i = 0; i < S.players.length; i++) {
      if (S.players[i].paid === undefined) S.players[i].paid = false;
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return JSON.parse(JSON.stringify(BLANK));
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
  }

  function nextPlayerId() {
    let max = 0;
    for (const p of S.players) if (p.id > max) max = p.id;
    return max + 1;
  }

  function activeP() {
    return S.players.filter(function (p) { return !p.removed; });
  }

  function pName(id) {
    if (id === null || id === undefined) return "TBD";
    if (id === "BYE") return "BYE";
    const p = S.players.find(function (x) { return x.id === id; });
    return p ? p.name : "TBD";
  }

  function findMatch(code) {
    return S.bracket.W[code] || S.bracket.L[code] || S.bracket.F[code] || S.bracket.R[code];
  }

  function nextPowerOf2(n) {
    let p = 1;
    while (p < n) p *= 2;
    return p;
  }

  function getSeedOrder(num) {
    if (num === 2) return [1, 2];
    const prev = getSeedOrder(num / 2);
    const next = [];
    for (let i = 0; i < prev.length; i++) {
      next.push(prev[i]);
      next.push(num + 1 - prev[i]);
    }
    return next;
  }

  function addFeed(target, slot, from, type) {
    if (!S.feeders[target]) S.feeders[target] = { p1: [], p2: [] };
    S.feeders[target][slot].push({ from: from, type: type });
  }

  function buildFeeders(size, totalWRounds, totalLRounds) {
    S.feeders = {};
    for (let r = 1; r < totalWRounds; r++) {
      const matchCount = size / Math.pow(2, r);
      for (let i = 1; i <= matchCount; i++) {
        const nextW = "W" + (r + 1) + "-" + Math.ceil(i / 2);
        addFeed(nextW, i % 2 === 1 ? "p1" : "p2", "W" + r + "-" + i, "winner");
      }
    }
    addFeed("F1", "p1", "W" + totalWRounds + "-1", "winner");

    for (let r = 1; r <= totalWRounds; r++) {
      const matchCount = size / Math.pow(2, r);
      for (let i = 1; i <= matchCount; i++) {
        const code = "W" + r + "-" + i;
        if (totalLRounds === 0) {
          if (r === totalWRounds) addFeed("F1", "p2", code, "loser");
        } else if (r === 1) {
          addFeed("L1-" + Math.ceil(i / 2), i % 2 === 1 ? "p1" : "p2", code, "loser");
        } else {
          const targetLR = (r - 1) * 2;
          const count = Math.pow(2, Math.floor((totalLRounds - targetLR) / 2));
          const dropIndex = count - i + 1;
          addFeed("L" + targetLR + "-" + dropIndex, "p2", code, "loser");
        }
      }
    }

    for (let r = 1; r < totalLRounds; r++) {
      const matchCount = Math.pow(2, Math.floor((totalLRounds - r) / 2));
      for (let i = 1; i <= matchCount; i++) {
        const code = "L" + r + "-" + i;
        if (r === totalLRounds - 1) addFeed("F1", "p2", code, "winner");
        else if (r % 2 === 1) addFeed("L" + (r + 1) + "-" + i, "p1", code, "winner");
        else {
          const nextL = "L" + (r + 1) + "-" + Math.ceil(i / 2);
          addFeed(nextL, i % 2 === 1 ? "p1" : "p2", code, "winner");
        }
      }
    }
    addFeed("R1", "p1", "F1", "p1");
    addFeed("R1", "p2", "F1", "p2");
  }

  function buildBracket() {
    const players = activeP();
    const n = players.length;
    const size = nextPowerOf2(n);
    const totalWRounds = Math.log2(size);
    const totalLRounds = totalWRounds > 1 ? (totalWRounds - 1) * 2 : 0;
    const seeds = getSeedOrder(size);

    S.bracket = { W: {}, L: {}, F: {}, R: {} };

    for (let r = 1; r <= totalWRounds; r++) {
      const matchCount = size / Math.pow(2, r);
      for (let m = 1; m <= matchCount; m++) {
        const code = "W" + r + "-" + m;
        let p1 = null, p2 = null;
        if (r === 1) {
          const s1 = seeds[(m - 1) * 2];
          const s2 = seeds[(m - 1) * 2 + 1];
          p1 = s1 <= n ? players[s1 - 1].id : "BYE";
          p2 = s2 <= n ? players[s2 - 1].id : "BYE";
        }
        S.bracket.W[code] = {
          code: code,
          label: "Winners R" + r + " — M" + m,
          p1: p1, p2: p2,
          s1: 0, s2: 0,
          winner: null, loser: null,
          status: "pending"
        };
      }
    }

    for (let r = 1; r <= totalLRounds; r++) {
      const matchCount = Math.pow(2, Math.floor((totalLRounds - r) / 2));
      for (let m = 1; m <= matchCount; m++) {
        const code = "L" + r + "-" + m;
        S.bracket.L[code] = {
          code: code,
          label: "Losers R" + r + " — M" + m,
          p1: null, p2: null,
          s1: 0, s2: 0,
          winner: null, loser: null,
          status: "pending"
        };
      }
    }

    S.bracket.F.F1 = {
      code: "F1",
      label: "Grand Final",
      p1: null, p2: null,
      s1: 0, s2: 0,
      winner: null, loser: null,
      status: "pending"
    };
    S.bracket.R.R1 = {
      code: "R1",
      label: "Bracket Reset (if needed)",
      p1: null, p2: null,
      s1: 0, s2: 0,
      winner: null, loser: null,
      status: "pending"
    };

    buildFeeders(size, totalWRounds, totalLRounds);
    resolveAuto();
  }

  function slotWillGetPlayer(matchCode, slot) {
    const feeds = (S.feeders[matchCode] && S.feeders[matchCode][slot]) || [];
    for (let i = 0; i < feeds.length; i++) {
      const f = feeds[i];
      const src = findMatch(f.from);
      if (!src) continue;
      if (src.status !== "done") return true;
      if (f.type === "loser") {
        if (src.loser && src.loser !== "BYE") return true;
      } else if (f.type === "winner") {
        if (src.winner && src.winner !== "BYE") return true;
      } else if (f.type === "p1" || f.type === "p2") {
        const val = src[f.type];
        if (val && val !== "BYE") return true;
      }
    }
    return false;
  }

  function feedNext(m) {
    const code = m.code;
    const winner = m.winner;
    const loser = m.loser;

    if (code.startsWith("W")) {
      const parts = code.substring(1).split("-");
      const r = parseInt(parts[0], 10);
      const i = parseInt(parts[1], 10);
      const nextW = "W" + (r + 1) + "-" + Math.ceil(i / 2);
      if (S.bracket.W[nextW]) {
        if (i % 2 === 1) S.bracket.W[nextW].p1 = winner;
        else S.bracket.W[nextW].p2 = winner;
      } else {
        S.bracket.F.F1.p1 = winner;
      }

      if (loser && loser !== "BYE") {
        const totalLRounds = Object.keys(S.bracket.L).reduce(function (max, k) {
          return Math.max(max, parseInt(k.substring(1).split("-")[0], 10));
        }, 0);

        if (totalLRounds === 0) {
          S.bracket.F.F1.p2 = loser;
        } else if (r === 1) {
          const nextL = "L1-" + Math.ceil(i / 2);
          if (S.bracket.L[nextL]) {
            if (i % 2 === 1) S.bracket.L[nextL].p1 = loser;
            else S.bracket.L[nextL].p2 = loser;
          }
        } else {
          const targetLR = (r - 1) * 2;
          const count = Object.keys(S.bracket.L).filter(function (k) {
            return k.startsWith("L" + targetLR + "-");
          }).length;
          const dropIndex = count - i + 1;
          const nextL = "L" + targetLR + "-" + dropIndex;
          if (S.bracket.L[nextL]) S.bracket.L[nextL].p2 = loser;
        }
      }
    } else if (code.startsWith("L")) {
      const parts = code.substring(1).split("-");
      const r = parseInt(parts[0], 10);
      const i = parseInt(parts[1], 10);
      const totalLRounds = Object.keys(S.bracket.L).reduce(function (max, k) {
        return Math.max(max, parseInt(k.substring(1).split("-")[0], 10));
      }, 0);

      if (r === totalLRounds) S.bracket.F.F1.p2 = winner;
      else if (r % 2 === 1) {
        const nextL = "L" + (r + 1) + "-" + i;
        if (S.bracket.L[nextL]) S.bracket.L[nextL].p1 = winner;
      } else {
        const nextL = "L" + (r + 1) + "-" + Math.ceil(i / 2);
        if (S.bracket.L[nextL]) {
          if (i % 2 === 1) S.bracket.L[nextL].p1 = winner;
          else S.bracket.L[nextL].p2 = winner;
        }
      }
    } else if (code === "F1") {
      if (winner === m.p1) {
        S.bracket.F.F1.winner = winner;
        S.phase = "complete";
        suggestPayoutsIfEmpty();
      } else {
        S.bracket.R.R1.p1 = m.p1;
        S.bracket.R.R1.p2 = m.p2;
      }
    } else if (code === "R1") {
      S.phase = "complete";
      suggestPayoutsIfEmpty();
    }
  }

  function completeMatch(m, winnerId, loserId) {
    m.winner = winnerId;
    m.loser = loserId;
    m.status = "done";
    feedNext(m);
    resolveAuto();
  }

  function resolveByesIn(obj) {
    for (const code in obj) {
      const m = obj[code];
      if (m.status !== "pending") continue;
      if (m.p1 === "BYE" || m.p2 === "BYE") {
        if (m.p1 === "BYE" && m.p2 === "BYE") {
          completeMatch(m, "BYE", "BYE");
        } else if (m.p1 === "BYE") {
          completeMatch(m, m.p2, "BYE");
        } else {
          completeMatch(m, m.p1, "BYE");
        }
      }
    }
  }

  function resolveWalkovers() {
    const all = [];
    for (const k in S.bracket.W) all.push(S.bracket.W[k]);
    for (const k in S.bracket.L) all.push(S.bracket.L[k]);
    all.push(S.bracket.F.F1, S.bracket.R.R1);

    for (let i = 0; i < all.length; i++) {
      const m = all[i];
      if (m.status === "done") continue;

      const ok1 = m.p1 && m.p1 !== "BYE";
      const ok2 = m.p2 && m.p2 !== "BYE";
      if (ok1 && ok2) continue;

      if (ok1 && !ok2 && !slotWillGetPlayer(m.code, "p2")) {
        completeMatch(m, m.p1, m.p2);
      } else if (ok2 && !ok1 && !slotWillGetPlayer(m.code, "p1")) {
        completeMatch(m, m.p2, m.p1);
      }
    }
  }

  function resolveAuto() {
    resolveByesIn(S.bracket.W);
    resolveWalkovers();
    resolveByesIn(S.bracket.W);
    resolveWalkovers();
  }

  function getPlayableMatches() {
    const list = [];
    function collect(obj) {
      for (const k in obj) {
        const m = obj[k];
        if (m.status !== "done" && m.p1 && m.p2 && m.p1 !== "BYE" && m.p2 !== "BYE") list.push(m);
      }
    }
    collect(S.bracket.W);
    collect(S.bracket.L);
    if (S.bracket.F.F1.status !== "done" && S.bracket.F.F1.p1 && S.bracket.F.F1.p2) list.push(S.bracket.F.F1);
    if (S.bracket.F.F1.status === "done" && S.bracket.R.R1.p1 && S.bracket.R.R1.p2 && S.bracket.R.R1.status !== "done") {
      list.push(S.bracket.R.R1);
    }
    return list;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }

  function fmtMoney(n) {
    n = Number(n) || 0;
    return "$" + n;
  }

  function paidCount() {
    return activeP().filter(function (p) { return p.paid; }).length;
  }

  function buyInTotal() {
    return paidCount() * (S.buyIn || 0);
  }

  function totalPot() {
    return buyInTotal() + (S.barAdded || 0);
  }

  function settingMax(key) {
    if (key === "tables") return 20;
    if (key === "raceTo") return 99;
    return 9999;
  }

  function inputId(key) {
    return "in" + key.charAt(0).toUpperCase() + key.slice(1);
  }

  function getStandings() {
    const first = S.bracket.R.R1.winner || S.bracket.F.F1.winner;
    let second = null;
    if (S.bracket.R.R1.status === "done") second = S.bracket.R.R1.loser;
    else if (S.bracket.F.F1.status === "done") second = S.bracket.F.F1.loser;
    return { first: first, second: second };
  }

  function suggestPayoutsIfEmpty() {
    const pot = totalPot();
    if (pot <= 0) return;
    if (!S.payout1) S.payout1 = Math.round(pot * 0.6);
    if (!S.payout2) S.payout2 = Math.round(pot * 0.3);
    if (!S.payout3) S.payout3 = Math.max(0, pot - S.payout1 - S.payout2);
  }

  function renderMoneyCard(showBarButtons) {
    const pot = totalPot();
    const paid = paidCount();
    const buy = S.buyIn || 0;
    let html =
      '<div class="card moneyCard">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
      "<h3>Pot " + fmtMoney(pot) + "</h3>" +
      '<span class="badge warn">' + paid + " paid</span></div>" +
      '<p class="sub" style="margin:6px 0">Buy-ins ' + fmtMoney(buyInTotal()) +
      " (" + paid + " × " + fmtMoney(buy) + ") · Bar adds " + fmtMoney(S.barAdded || 0) + "</p>";

    if (showBarButtons) {
      html +=
        '<div class="row" style="margin-top:8px;flex-wrap:wrap">' +
        '<button type="button" class="ghost small" onclick="window.bumpBar(5)">Bar +$5</button>' +
        '<button type="button" class="ghost small" onclick="window.bumpBar(10)">Bar +$10</button>' +
        '<button type="button" class="ghost small" onclick="window.bumpBar(20)">Bar +$20</button>' +
        '<button type="button" class="ghost small" onclick="window.bumpBar(-5)">Bar −$5</button>' +
        "</div>";
    }

    if (S.phase === "complete") {
      suggestPayoutsIfEmpty();
      const st = getStandings();
      html += '<div style="margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px">';
      html += '<div class="sub" style="margin-bottom:8px">Payouts (edit amounts)</div>';
      html += stepperRow("payout1", "1st — " + (st.first ? esc(pName(st.first)) : "champion"), 9999);
      html += stepperRow("payout2", "2nd — " + (st.second ? esc(pName(st.second)) : "runner-up"), 9999);
      html += stepperRow("payout3", "3rd place $", 9999);
      const payoutSum = (S.payout1 || 0) + (S.payout2 || 0) + (S.payout3 || 0);
      html += '<p class="sub">Payout total ' + fmtMoney(payoutSum) + " · pot " + fmtMoney(pot) + "</p>";
      html += "</div>";
    }
    return html + "</div>";
  }

  function renderPlayerRow(p, i, context) {
    const buy = S.buyIn || 0;
    let paidPart = "";
    if (buy > 0) {
      paidPart =
        '<button type="button" class="small paidBtn ' + (p.paid ? "primary" : "ghost") +
        '" onclick="window.togglePaid(' + p.id + ')">' +
        (p.paid ? "Paid " + fmtMoney(buy) : "Not paid") +
        "</button>";
    }
  const canEdit = S.phase === "setup";
    if (context === "setup") {
      return (
        '<div class="itemRow">' +
        '<span><b>' + (i + 1) + ". " + esc(p.name) + "</b></span>" +
        '<div class="row">' + paidPart +
        '<button type="button" class="small danger" onclick="window.removeP(' + p.id + ')">X</button>' +
        "</div></div>"
      );
    }
    return (
      '<div class="itemRow">' +
      '<div style="flex:1"><div class="sub">Seed ' + (i + 1) + "</div>" +
      '<input value="' + esc(p.name) + '" onchange="window.editPlayerName(' + p.id + ', this.value)" ' +
      (canEdit ? "" : "disabled") + ">" +
      "</div>" +
      '<div class="row">' + paidPart +
      (canEdit
        ? '<button class="small ghost" onclick="window.moveSeed(' + p.id + ',-1)" ' + (i === 0 ? "disabled" : "") + ">↑</button>" +
          '<button class="small ghost" onclick="window.moveSeed(' + p.id + ',1)" ' + (i === activeP().length - 1 ? "disabled" : "") + ">↓</button>" +
          '<button class="small danger" onclick="window.removeP(' + p.id + ')">X</button>'
        : "") +
      "</div></div>"
    );
  }

  function scoreClass(score) {
    if (S.raceTo > 0 && score >= S.raceTo) return "score raceHit";
    return "score";
  }

  function canStart() {
    return activeP().length >= 2 && S.tables >= 1 && S.raceTo >= 1;
  }

  function setupIssues() {
    const issues = [];
    if (S.tables < 1) issues.push("tables");
    if (S.raceTo < 1) issues.push("race to");
    if (activeP().length < 2) issues.push("2+ players");
    return issues;
  }

  function readSetupInputs() {
    const keys = ["tables", "raceTo", "buyIn", "barAdded", "payout1", "payout2", "payout3"];
    for (let i = 0; i < keys.length; i++) {
      const el = document.getElementById(inputId(keys[i]));
      if (el) S[keys[i]] = clampNum(el.value, 0, settingMax(keys[i]));
    }
    save();
  }

  function clampNum(val, min, max) {
    const n = parseInt(val, 10);
    if (isNaN(n)) return min;
    return Math.max(min, Math.min(max, n));
  }

  function updateSetupBanner() {
    const el = document.getElementById("setupStatus");
    if (!el) return;
    if (S.phase !== "setup") return;
    const issues = setupIssues();
    if (!issues.length) {
      el.innerHTML = '<span class="badge green">Ready — tap Start below</span>';
    } else {
      el.innerHTML = '<span class="badge warn">Still need: ' + esc(issues.join(", ")) + "</span>";
    }
  }

  function stepperRow(key, label, max) {
    max = max || settingMax(key);
    return (
      '<div class="settingBlock">' +
      '<label class="sub">' + label + "</label>" +
      '<div class="stepper">' +
      '<button type="button" aria-label="decrease" onclick="window.bumpSetting(\'' + key + '\',-1)">−</button>' +
      '<input id="' + inputId(key) + '" type="number" min="0" max="' + max + '" value="' + S[key] + '" inputmode="numeric" enterkeyhint="done" oninput="window.onSettingInput(\'' + key + '\', this.value)">' +
      '<button type="button" aria-label="increase" onclick="window.bumpSetting(\'' + key + '\',1)">+</button>' +
      "</div></div>"
    );
  }

  function renderSetupFlow(v) {
    const issues = setupIssues();
    const settingsOk = S.tables >= 1 && S.raceTo >= 1;
    const playersOk = activeP().length >= 2;

    v.innerHTML =
      '<div class="card">' +
      '<h3>Get started</h3>' +
      '<p class="sub" style="margin:4px 0 8px">Tap +/− or type numbers. Green buttons move you forward.</p>' +
      '<div id="setupStatus">' +
      (issues.length
        ? '<span class="badge warn">Still need: ' + esc(issues.join(", ")) + "</span>"
        : '<span class="badge green">Ready — tap Start below</span>') +
      "</div></div>" +

      '<div class="card stepCard' + (settingsOk ? " done" : "") + '">' +
      '<div class="stepNum">STEP 1</div><h3>Tables, race & money</h3>' +
      stepperRow("tables", "How many tables?") +
      stepperRow("raceTo", "Race to (games to win)") +
      stepperRow("buyIn", "Buy-in per player ($)") +
      stepperRow("barAdded", "Bar adds to pot ($)") +
      '<button type="button" class="primary cta" onclick="window.applySetupContinue()">' +
      (settingsOk ? "Continue → add players" : "Save these numbers") +
      "</button></div>" +

      '<div class="card stepCard' + (playersOk ? " done" : "") + '">' +
      '<div class="stepNum">STEP 2</div><h3>Players (' + activeP().length + ")</h3>" +
      (S.buyIn > 0 ? '<p class="sub" style="margin:4px 0">Tap <b>Not paid</b> when someone pays ' + fmtMoney(S.buyIn) + ".</p>" : "") +
      '<form onsubmit="window.submitPlayerAdd(); return false;" class="row" style="margin-top:8px">' +
      '<input id="qName" placeholder="Player name" enterkeyhint="done" autocomplete="off">' +
      '<button type="submit" class="primary">Add</button></form>' +
      '<p class="sub" style="margin:6px 0">Keyboard Enter / Done adds the name.</p>' +
      (activeP().length
        ? '<div style="margin-top:8px">' +
          activeP().map(function (p, i) { return renderPlayerRow(p, i, "setup"); }).join("") +
          "</div>"
        : '<p class="sub" style="margin-top:8px">Add at least 2 players.</p>') +
      "</div>" +

      '<div class="card stepCard' + (canStart() ? " done" : "") + '">' +
      '<div class="stepNum">STEP 3</div><h3>Start</h3>' +
      renderMoneyCard(false) +
      '<p class="sub" style="margin:4px 0 8px">' + S.tables + " tables · race to " + S.raceTo + " · " + activeP().length + " players</p>" +
      '<button type="button" class="primary cta" onclick="window.startTourney()" ' + (canStart() ? "" : "disabled") + ">" +
      (canStart() ? "START TOURNAMENT" : "Finish steps 1 & 2 first") +
      "</button></div>" +

      '<div class="card"><button type="button" class="danger cta" onclick="window.hardResetZero()">Clear everything</button></div>';
  }

  function renderHome(v) {
    if (S.phase === "setup") {
      renderSetupFlow(v);
      return;
    }

    const playable = getPlayableMatches();
    let html = renderMoneyCard(true);
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3>Active tables (' + playable.length + ' ready)</h3></div>';

    const tableCount = Math.max(1, S.tables);
    for (let i = 1; i <= tableCount; i++) {
      const m = playable[i - 1];
      if (m) {
        html +=
          '<div class="tableCard">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="badge green">Table ' + i + '</span><span class="sub">' + esc(m.label) + '</span></div>' +
          '<div class="fighter"><b>' + esc(pName(m.p1)) + '</b>' +
          '<div class="scoreBox">' +
          '<button class="small ghost" onclick="window.score(\'' + m.code + '\',1,-1)">-</button>' +
          '<span class="' + scoreClass(m.s1 || 0) + '">' + (m.s1 || 0) + '</span>' +
          '<button class="small ghost" onclick="window.score(\'' + m.code + '\',1,1)">+</button>' +
          '<button class="small primary" onclick="window.recordMatchWin(\'' + m.code + '\',' + m.p1 + ')">Win</button>' +
          '</div></div>' +
          '<div class="fighter"><b>' + esc(pName(m.p2)) + '</b>' +
          '<div class="scoreBox">' +
          '<button class="small ghost" onclick="window.score(\'' + m.code + '\',2,-1)">-</button>' +
          '<span class="' + scoreClass(m.s2 || 0) + '">' + (m.s2 || 0) + '</span>' +
          '<button class="small ghost" onclick="window.score(\'' + m.code + '\',2,1)">+</button>' +
          '<button class="small primary" onclick="window.recordMatchWin(\'' + m.code + '\',' + m.p2 + ')">Win</button>' +
          '</div></div></div>';
      } else {
        html += '<div class="tableCard" style="opacity:.4"><span class="badge">Table ' + i + '</span><span class="sub" style="margin-left:8px">Idle / waiting on bracket</span></div>';
      }
    }

    if (S.phase === "complete") {
      const champ = S.bracket.R.R1.winner || S.bracket.F.F1.winner;
      html =
        '<div class="card" style="border:2px solid #2bc861"><h2>Champion: ' + esc(pName(champ)) + "</h2></div>" +
        renderMoneyCard(true) +
        html;
    }
    v.innerHTML = html;
  }

  function renderPlayers(v) {
    const list = activeP();
    let roster = list.length
      ? list.map(function (p, i) { return renderPlayerRow(p, i, "roster"); }).join("")
      : '<p class="sub">No players yet. Add names manually.</p>';

    v.innerHTML =
      renderMoneyCard(S.phase !== "setup") +
      '<div class="card"><h3>Add player</h3>' +
      '<p class="sub" style="margin:4px 0 8px">Up to ' + MAX_PLAYERS + " players. Tap paid when buy-in is collected.</p>" +
      '<form onsubmit="window.submitPlayerAdd(); return false;" class="row" style="margin-top:6px">' +
      '<input id="pName" placeholder="Name" enterkeyhint="done" autocomplete="off">' +
      '<button type="submit" class="primary">Add</button></form></div>' +
      '<div class="card"><h3>Roster (' + list.length + ")</h3>" + roster + "</div>";
  }

  function renderBracket(v) {
    function renderGroup(title, obj) {
      let out = '<div class="card"><h3>' + title + '</h3>';
      const keys = Object.keys(obj).sort();
      if (!keys.length) out += '<p class="sub">None yet.</p>';
      for (let i = 0; i < keys.length; i++) {
        const m = obj[keys[i]];
        const badge = m.status === "done" ? "green" : "warn";
        const status = m.winner ? esc(pName(m.winner)) + " won" : "Pending";
        out +=
          '<div class="itemRow"><div><b>' + esc(m.label) + '</b>' +
          '<div class="sub">' + esc(pName(m.p1)) + ' vs ' + esc(pName(m.p2)) +
          (m.status === "done" ? " · " + (m.s1 || 0) + "-" + (m.s2 || 0) : "") +
          '</div></div><span class="badge ' + badge + '">' + status + '</span></div>';
      }
      return out + "</div>";
    }

    if (S.phase === "setup") {
      v.innerHTML = '<div class="card"><p class="sub">Bracket builds when you start the tournament.</p></div>';
      return;
    }

    v.innerHTML =
      renderGroup("Winners bracket", S.bracket.W) +
      renderGroup("Losers bracket", S.bracket.L) +
      renderGroup("Finals", Object.assign({}, S.bracket.F, S.bracket.R));
  }

  function renderSetup(v) {
    renderSetupFlow(v);
  }

  function render() {
    save();
    const phaseEl = document.getElementById("tPhase");
    phaseEl.innerText = S.phase === "setup" ? "Setup" : S.phase === "active" ? "Live" : "Complete";

    const homeBtn = document.getElementById("b-home");
    if (homeBtn) homeBtn.textContent = S.phase === "setup" ? "Start" : "Tables";

    document.querySelectorAll(".dock button").forEach(function (b) { b.classList.remove("active"); });
    const btn = document.getElementById("b-" + S.tab);
    if (btn) btn.classList.add("active");

    const v = document.getElementById("view");
    if (S.tab === "home") renderHome(v);
    else if (S.tab === "players") renderPlayers(v);
    else if (S.tab === "bracket") renderBracket(v);
    else if (S.tab === "setup") renderSetup(v);
  }

  window.setTab = function (t) {
    if (S.phase === "setup" && (t === "home" || t === "setup")) {
      readSetupInputs();
    }
    S.tab = t;
    render();
  };

  window.bumpSetting = function (key, delta) {
    const max = settingMax(key);
    S[key] = clampNum(S[key] + delta, 0, max);
    save();
    render();
  };

  window.onSettingInput = function (key, val) {
    S[key] = clampNum(val, 0, settingMax(key));
    save();
    updateSetupBanner();
    const inp = document.getElementById(inputId(key));
    if (inp && inp.value !== String(S[key])) inp.value = S[key];
  };

  window.bumpBar = function (amt) {
    S.barAdded = clampNum((S.barAdded || 0) + amt, 0, 9999);
    save();
    render();
  };

  window.togglePaid = function (id) {
    const p = S.players.find(function (x) { return x.id === id; });
    if (!p) return;
    p.paid = !p.paid;
    save();
    render();
  };

  window.applySetupContinue = function () {
    readSetupInputs();
    if (S.tables < 1 || S.raceTo < 1) {
      alert("Set tables (1+) and race to (1+) first.");
      return;
    }
    S.tab = "home";
    render();
    const nameEl = document.getElementById("qName");
    if (nameEl) nameEl.focus();
  };

  window.updateSettings = function (key, val) {
    S[key] = clampNum(val, 0, settingMax(key));
    save();
    render();
  };

  window.submitPlayerAdd = function () {
    const el = document.getElementById("qName") || document.getElementById("pName");
    if (el && el.value.trim()) {
      window.addP(el.value);
      el.value = "";
      el.focus();
    }
  };

  window.quickAdd = function () {
    window.submitPlayerAdd();
  };

  window.addP = function (name) {
    name = (name || "").trim();
    if (!name) return;
    if (activeP().length >= MAX_PLAYERS) {
      alert("Max " + MAX_PLAYERS + " players.");
      return;
    }
    S.players.push({ id: nextPlayerId(), name: name, removed: false, paid: false });
    render();
  };

  window.editPlayerName = function (id, name) {
    const p = S.players.find(function (x) { return x.id === id; });
    if (!p) return;
    name = (name || "").trim();
    if (!name) return;
    p.name = name;
    render();
  };

  window.moveSeed = function (id, dir) {
    if (S.phase !== "setup") return;
    const list = activeP();
    const idx = list.findIndex(function (p) { return p.id === id; });
    if (idx < 0) return;
    const swap = idx + dir;
    if (swap < 0 || swap >= list.length) return;
    const all = S.players.filter(function (p) { return !p.removed; });
    const a = all[idx];
    const b = all[swap];
    const ia = S.players.indexOf(a);
    const ib = S.players.indexOf(b);
    S.players[ia] = b;
    S.players[ib] = a;
    render();
  };

  window.removeP = function (id) {
    if (S.phase !== "setup") return;
    const p = S.players.find(function (x) { return x.id === id; });
    if (p && confirm("Remove " + p.name + "?")) {
      p.removed = true;
      render();
    }
  };

  window.startTourney = function () {
    if (!canStart()) return;
    S.phase = "active";
    buildBracket();
    window.setTab("home");
  };

  window.score = function (code, playerSlot, delta) {
    const m = findMatch(code);
    if (!m || m.status === "done") return;
    if (playerSlot === 1) m.s1 = Math.max(0, (m.s1 || 0) + delta);
    if (playerSlot === 2) m.s2 = Math.max(0, (m.s2 || 0) + delta);
    render();
  };

  window.recordMatchWin = function (code, winnerId) {
    const m = findMatch(code);
    if (!m || m.status === "done") return;
    const loserId = m.p1 === winnerId ? m.p2 : m.p1;
    const wScore = m.p1 === winnerId ? m.s1 : m.s2;
    const lScore = m.p1 === winnerId ? m.s2 : m.s1;
    if (S.raceTo > 0 && wScore < S.raceTo) {
      if (!confirm(pName(winnerId) + " has not reached race to " + S.raceTo + " yet. Record win anyway?")) return;
    }
    if (!confirm(pName(winnerId) + " wins (" + wScore + "-" + lScore + ")?")) return;
    completeMatch(m, winnerId, loserId);
    render();
  };

  window.hardResetZero = function () {
    if (!confirm("Erase all data and reset to zero?")) return;
    localStorage.removeItem(STORAGE_KEY);
    S = JSON.parse(JSON.stringify(BLANK));
    window.setTab("setup");
  };

  if (S.phase === "setup" && S.tab === "home") S.tab = "setup";
  render();
})();
  </script>
</body>
</html>
